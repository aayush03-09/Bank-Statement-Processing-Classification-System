{% extends "base.html" %}
{% block title %}Dashboard{% endblock %}
{% block content %}
<h2 class="page-title">Dashboard</h2>
<div class="grid cards-grid">
  <div class="card">
    <h3>Total Statements</h3>
    <p class="metric">0</p>
  </div>
  <div class="card">
    <h3>Total Transactions</h3>
    <p class="metric">0</p>
  </div>
  <div class="card">
    <h3>Total Credits</h3>
    <p class="metric">0</p>
  </div>
  <div class="card">
    <h3>Total Debits</h3>
    <p class="metric">0</p>
  </div>
  <div class="card">
    <h3>Transactions Awaiting Review</h3>
    <p class="metric">0</p>
  </div>
  <div class="card">
    <h3>Extraction Success Rate</h3>
    <p class="metric">0%</p>
  </div>
  <div class="card">
    <h3>Reconciliation Issues</h3>
    <p class="metric">0</p>
  </div>
</div>
{% endblock %}
